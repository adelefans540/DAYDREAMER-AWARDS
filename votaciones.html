<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYDREAMERS AWARDS - Votaciones</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Se agregan fuentes clásicas: Playfair Display para títulos, Poppins para interfaz -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, doc, updateDoc, increment, onSnapshot, arrayUnion, setDoc 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de Firebase (Intacta)
        const firebaseConfig = {
            apiKey: "AIzaSyAAW-bBHn7MXXJNsVW0EAiH5kf69C9DAeg",
            authDomain: "app-de-proyectos-3279c.firebaseapp.com",
            projectId: "app-de-proyectos-3279c",
            storageBucket: "app-de-proyectos-3279c.firebasestorage.app",
            messagingSenderId: "1055271736396",
            appId: "1:1055271736396:web:e486e47d23f1c6420f50e9",
            measurementId: "G-09W0G43NXG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'adele-fans-app';

        window.fb = { db, appId, collection, addDoc, doc, updateDoc, increment, onSnapshot, arrayUnion, setDoc };

        // Autenticación Anónima
        window.currentUserUid = null;
        signInAnonymously(auth).catch((error) => console.error("Error Auth Firebase:", error));
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUserUid = user.uid;
                initAwardsLogic();
            }
        });
    </script>

    <style>
        /* === VARIABLES Y TEMAS (Diseño Clásico y Elegante) === */
        :root {
            --light-bg: #FAFAFA; /* Fondo marfil/limpio clásico */
            --text-main: #222222;
            --text-muted: #666666;
            --gold: #C5A059; /* Tono dorado elegante y sobrio */
            --gold-hover: #AF8C48;
            --gold-light: rgba(197, 160, 89, 0.1);
            --card-bg: #FFFFFF;
            --border-color: #EAEAEA;
            --font-ui: 'Poppins', sans-serif;
            --font-classic: 'Playfair Display', serif; /* Fuente serif para dar toque editorial */
            --shadow-classic: 0 4px 12px rgba(0, 0, 0, 0.03);
            --input-bg: #FFFFFF;
            --radius-classic: 4px; /* Bordes más rectos, estilo revista */
        }

        [data-theme="dark"] {
            --light-bg: #121212;
            --text-main: #F0F0F0;
            --text-muted: #A0A0A0;
            --gold: #D4AF37; 
            --gold-hover: #C5A059;
            --gold-light: rgba(212, 175, 55, 0.1);
            --card-bg: #1A1A1A;
            --border-color: #333333;
            --shadow-classic: 0 4px 15px rgba(0, 0, 0, 0.2);
            --input-bg: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
        
        body {
            background-color: var(--light-bg);
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden;
            font-family: var(--font-ui);
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 { font-family: var(--font-classic); font-weight: 600; }

        /* === NAVEGACIÓN === */
        nav {
            position: fixed; top: 0; width: 100%; height: 70px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 1000; background: var(--card-bg); 
            border-bottom: 1px solid var(--border-color); 
        }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .perfil-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold); }
        .logo-text { font-size: 18px; font-family: var(--font-classic); font-weight: 700; letter-spacing: 2px; color: var(--text-main); text-transform: uppercase; }

        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .icon-btn { 
            background: transparent; border: 1px solid var(--border-color); color: var(--text-main); 
            width: 34px; height: 34px; border-radius: var(--radius-classic); display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.3s;
        }
        .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
        .return-link { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .return-link:hover { color: var(--gold); }

        /* === HEADER DE PREMIOS === */
        .awards-header { margin-top: 100px; text-align: center; padding: 0 20px; }
        .banner-wrapper { 
            width: 100%; max-width: 900px; margin: 0 auto 20px; border-radius: var(--radius-classic); 
            overflow: hidden; border: 1px solid var(--border-color);
            background: var(--card-bg);
        }
        .awards-banner { width: 100%; height: auto; display: block; object-fit: contain; }
        .awards-subtitle { font-size: 15px; color: var(--text-muted); margin-top: 15px; max-width: 700px; margin-left: auto; margin-right: auto; font-weight: 400; font-family: var(--font-classic); font-style: italic; }
        .opening-notice { font-size: 14px; font-weight: 500; color: #d9534f; margin-top: 15px; display: none; padding: 12px 20px; border: 1px solid #d9534f; border-radius: var(--radius-classic); max-width: max-content; margin-inline: auto; text-transform: uppercase; letter-spacing: 1px; }

        /* === DASHBOARD DE UX (Estilo Panel de Control) === */
        .dashboard-ux {
            max-width: 1100px; width: 90%; margin: 40px auto 30px; padding: 25px; background: var(--card-bg);
            border-radius: var(--radius-classic); border: 1px solid var(--border-color); 
            box-shadow: var(--shadow-classic); display: flex; flex-direction: column; gap: 20px;
        }
        .dashboard-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        
        .countdown-timer { font-size: 15px; font-weight: 500; color: var(--gold); display: flex; align-items: center; gap: 8px; border: 1px solid var(--gold); padding: 8px 16px; border-radius: var(--radius-classic); background: var(--gold-light); text-transform: uppercase; letter-spacing: 1px; }
        
        .progress-container { flex-grow: 1; max-width: 500px; width: 100%; }
        .progress-text { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .progress-bar-bg { width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .search-filters { display: flex; gap: 15px; width: 100%; }
        .search-input, .filter-select {
            padding: 12px 18px; border-radius: var(--radius-classic); border: 1px solid var(--border-color); outline: none;
            background: var(--input-bg); color: var(--text-main); flex-grow: 1; font-size: 14px; font-family: var(--font-ui);
        }
        .search-input:focus, .filter-select:focus { border-color: var(--gold); }
        .filter-select { flex-grow: 0; min-width: 220px; cursor: pointer; }

        /* === CONTENEDOR DE CATEGORÍAS (Diseño Editorial) === */
        .categories-container { max-width: 1100px; width: 95%; margin: 20px auto 100px; padding: 0; display: flex; flex-direction: column; gap: 60px; }
        .category-section { background: transparent; padding: 0; border: none; box-shadow: none; }
        
        .category-title { 
            font-size: 28px; color: var(--text-main); margin-bottom: 25px; 
            border-bottom: 2px solid var(--border-color); padding-bottom: 10px; 
            font-weight: 700; letter-spacing: 1px; position: relative;
        }
        .category-title::after {
            content: ''; position: absolute; left: 0; bottom: -2px; width: 60px; height: 2px; background: var(--gold);
        }

        /* === GRILLA DE NOMINADOS === */
        .nominees-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; }
        .nominee-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-classic);
            overflow: hidden; text-align: left; transition: all 0.3s ease; position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .nominee-card:hover { border-color: var(--gold); box-shadow: var(--shadow-classic); transform: translateY(-3px); }
        .nominee-img-wrapper { width: 100%; aspect-ratio: 4/3; overflow: hidden; background: var(--border-color); border-bottom: 1px solid var(--border-color); }
        .nominee-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .nominee-card:hover .nominee-img { transform: scale(1.05); }
        
        .nominee-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; gap: 15px; }
        .nominee-header { margin-bottom: 10px; }
        .nominee-name { font-size: 18px; font-weight: 600; color: var(--text-main); font-family: var(--font-classic); line-height: 1.3; margin-bottom: 5px; }
        .nominee-followers { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .nominee-link { font-size: 12px; color: var(--gold); text-decoration: none; font-weight: 600; display: inline-block; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .nominee-link:hover { text-decoration: underline; color: var(--gold-hover); }
        
        .nominee-votes { font-size: 13px; color: var(--gold); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        
        .btn-vote {
            background: var(--gold); color: #fff; border: 1px solid var(--gold); padding: 10px 15px; width: 100%;
            border-radius: var(--radius-classic); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-vote:hover:not(:disabled) { background: var(--gold-hover); border-color: var(--gold-hover); }
        .btn-vote:disabled { background: var(--input-bg); color: var(--text-muted); cursor: not-allowed; border: 1px solid var(--border-color); opacity: 0.7; }

        .btn-edit-nominee {
            position: absolute; top: 12px; right: 12px; background: var(--card-bg);
            border: 1px solid var(--border-color); color: var(--text-main); width: 32px; height: 32px;
            border-radius: var(--radius-classic); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; z-index: 10;
        }
        .btn-edit-nominee:hover { background: var(--gold); color: #fff; border-color: var(--gold); }

        /* === BARRAS DE PORCENTAJE === */
        .result-bar-container { width: 100%; margin-top: 10px; text-align: left; }
        .result-bar-bg { width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
        .result-bar-fill { height: 100%; background: var(--gold); width: 0%; transition: width 1s ease-in-out; }
        .result-text { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; margin-bottom: 4px; }

        /* === SHARE CARD BOTÓN === */
        .btn-share-card {
            display: block; width: fit-content; margin: 0 auto 50px; padding: 14px 35px;
            background: var(--gold); color: white; border: none;
            border-radius: var(--radius-classic); font-size: 14px; font-weight: 600; cursor: pointer; 
            transition: all 0.3s ease; letter-spacing: 1px; text-transform: uppercase;
        }
        .btn-share-card:hover { background: var(--gold-hover); transform: translateY(-2px); }

        #shareCardRender {
            background: var(--card-bg); color: var(--text-main); padding: 40px; border-radius: 0;
            width: 420px; text-align: center; border: 10px solid var(--light-bg); outline: 1px solid var(--gold); position: absolute; left: -9999px; top: 0; font-family: var(--font-ui);
        }
        #shareCardRender h2 { margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; font-size: 20px; font-family: var(--font-classic); color: var(--gold); border-bottom: 1px solid var(--border-color); padding-bottom: 15px;}
        .share-item { padding: 12px 0; border-bottom: 1px solid var(--border-color); text-align: left; }
        .share-item span { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .share-item strong { font-size: 15px; font-family: var(--font-classic); color: var(--text-main); }

        /* === MODAL ADMIN Y GENERAL === */
        .admin-btn {
            position: fixed; bottom: 30px; left: 30px; width: 50px; height: 50px;
            background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
            border-radius: var(--radius-classic); display: flex; justify-content: center; align-items: center; font-size: 18px;
            cursor: pointer; z-index: 1500; transition: 0.3s; box-shadow: var(--shadow-classic);
        }
        .admin-btn:hover { border-color: var(--gold); color: var(--gold); }

        .custom-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: none;
            justify-content: center; align-items: center; z-index: 2500; padding: 20px;
        }
        .custom-modal {
            background: var(--card-bg); padding: 40px; border-radius: var(--radius-classic); border: 1px solid var(--border-color);
            max-width: 500px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.2); color: var(--text-main);
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .modal-title { color: var(--gold); font-size: 22px; margin-bottom: 25px; text-align: center; font-family: var(--font-classic); letter-spacing: 1px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 15px; border-radius: var(--radius-classic); background: var(--input-bg);
            border: 1px solid var(--border-color); color: var(--text-main); outline: none; font-size: 14px; transition: 0.3s; font-family: var(--font-ui);
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--gold); }
        .form-group textarea { resize: none; height: 90px; }
        input[type="file"] { padding: 10px; background: var(--input-bg); width: 100%; border: 1px dashed var(--border-color); cursor: pointer; }
        
        .btn-modal {
            background: var(--gold); color: #fff; border: 1px solid var(--gold); padding: 12px;
            font-size: 13px; font-weight: 600; border-radius: var(--radius-classic); cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-modal.cancel { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-modal.danger { background: #d9534f; border-color: #d9534f; color: white; }
        .btn-modal:hover { opacity: 0.9; }
        .btn-modal.cancel:hover { border-color: var(--text-main); }

        .admin-spinner { display: none; text-align: center; margin-top: 15px; color: var(--gold); font-weight: 500; font-size: 14px; }

        /* === ANIMACIÓN GENERATOR DE TARJETA (USER PROVIDED - Adaptada) === */
        .loader-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            width: auto;
            margin: 1.5rem auto;
            font-family: var(--font-classic);
            font-size: 1.4em;
            font-weight: 600;
            user-select: none;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .loader {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            z-index: 1;
            background-color: transparent;
            mask: repeating-linear-gradient( 90deg, transparent 0, transparent 6px, black 7px, black 8px );
            -webkit-mask: repeating-linear-gradient( 90deg, transparent 0, transparent 6px, black 7px, black 8px );
        }

        .loader::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 50% 50%, var(--gold) 0%, transparent 50%),
                              radial-gradient(circle at 45% 45%, var(--gold-hover) 0%, transparent 45%),
                              radial-gradient(circle at 55% 55%, var(--border-color) 0%, transparent 45%),
                              radial-gradient(circle at 45% 55%, var(--gold) 0%, transparent 45%),
                              radial-gradient(circle at 55% 45%, var(--gold-hover) 0%, transparent 45%);
            mask: radial-gradient( circle at 50% 50%, transparent 0%, transparent 10%, black 25% );
            -webkit-mask: radial-gradient( circle at 50% 50%, transparent 0%, transparent 10%, black 25% );
            animation: transform-animation 2s infinite alternate, opacity-animation 4s infinite;
            animation-timing-function: cubic-bezier(0.6, 0.8, 0.5, 1);
        }

        @keyframes transform-animation { 0% { transform: translate(-55%); } 100% { transform: translate(55%); } }
        @keyframes opacity-animation { 0%, 100% { opacity: 0; } 15% { opacity: 1; } 65% { opacity: 0; } }

        .loader-letter { display: inline-block; opacity: 0; animation: loader-letter-anim 4s infinite linear; z-index: 2; }
        .loader-letter:nth-child(1) { animation-delay: 0.1s; }
        .loader-letter:nth-child(2) { animation-delay: 0.205s; }
        .loader-letter:nth-child(3) { animation-delay: 0.31s; }
        .loader-letter:nth-child(4) { animation-delay: 0.415s; }
        .loader-letter:nth-child(5) { animation-delay: 0.521s; }
        .loader-letter:nth-child(6) { animation-delay: 0.626s; }
        .loader-letter:nth-child(7) { animation-delay: 0.731s; }
        .loader-letter:nth-child(8) { animation-delay: 0.837s; }
        .loader-letter:nth-child(9) { animation-delay: 0.942s; }
        .loader-letter:nth-child(10) { animation-delay: 1.047s; }

        @keyframes loader-letter-anim {
            0% { opacity: 0; }
            5% { opacity: 1; transform: translateY(-2px); }
            20% { opacity: 0.3; }
            100% { opacity: 0; }
        }

        /* ==========================================
           DISEÑO RESPONSIVE
        ========================================== */
        @media (max-width: 768px) {
            nav { padding: 0 15px; height: 60px; }
            .logo-text { font-size: 15px; }
            .perfil-img { width: 32px; height: 32px; }
            .awards-header { margin-top: 80px; padding: 0 15px; }
            
            .dashboard-ux { width: 95%; margin: 20px auto; padding: 20px 15px; }
            .dashboard-top { flex-direction: column; align-items: stretch; gap: 15px; }
            .countdown-timer { justify-content: center; }
            .search-filters { flex-direction: column; gap: 10px; }
            .filter-select { min-width: 100%; }
            
            .category-title { font-size: 22px; }
            .nominees-grid { gap: 20px; }
            
            .custom-modal { padding: 25px 20px; width: 95%; }
            .admin-btn { bottom: 20px; left: 20px; width: 45px; height: 45px; font-size: 16px; }
        }

        @media (max-width: 480px) {
            .logo-text { display: none; }
            .nominees-grid { grid-template-columns: 1fr; }
            .btn-share-card { width: 90%; padding: 12px 20px; font-size: 12px; }
            .modal-title { font-size: 18px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-container">
            <img src="icono.adele.jpeg" alt="Perfil" class="perfil-img" onerror="this.src='https://placehold.co/40x40/C5A059/FFFFFF?text=D'">
            <span class="logo-text">DAYDREAMERS AWARDS</span>
        </a>
        <div class="nav-controls">
            <button id="themeToggle" class="icon-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
            <button id="langToggle" class="icon-btn" onclick="toggleLanguage()" title="Change Language">ES</button>
            <a href="index.html" class="return-link" data-i18n="return"><i class="fas fa-arrow-left"></i> Return</a>
        </div>
    </nav>

    <header class="awards-header">
        <div class="banner-wrapper">
            <img src="adele-fans.jpeg" alt="Daydreamers Awards 2026" class="awards-banner" onerror="this.src='https://placehold.co/900x300/FAFAFA/C5A059?text=Awards+Banner'">
        </div>
        <p class="awards-subtitle" data-i18n="subtitle">Support your favorite creators, communities, and moments. Votes decide the season winners.</p>
        <p class="opening-notice" id="openingNotice" data-i18n="opening_notice"><i class="fas fa-calendar-alt"></i> Voting opens on September 15th!</p>
    </header>

    <div class="dashboard-ux">
        <div class="dashboard-top">
            <div id="countdown" class="countdown-timer"><i class="fas fa-clock"></i> <span data-i18n="calculating">Calculating...</span></div>
            <div class="progress-container">
                <p class="progress-text" id="progressText" data-i18n="voted_in_zero">You have voted in 0 out of 0 categories</p>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        <div class="search-filters">
            <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="Buscar nominado por nombre..." onkeyup="aplicarFiltros()">
            <select id="categoryFilter" class="filter-select" onchange="aplicarFiltros()">
                <option value="ALL" data-i18n="all_categories">All Categories</option>
            </select>
        </div>
    </div>

    <main class="categories-container" id="categoriesContainer">
        <div style="text-align: center; color: var(--gold); font-size: 18px; font-family: var(--font-classic);"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="loading_nominees">Loading nominees...</span></div>
    </main>

    <button class="btn-share-card" id="btnGenerarShare" style="display:none;" onclick="generarShareCard()">
        <i class="fas fa-camera"></i> <span data-i18n="generate_card">Generate My Voting Card</span>
    </button>

    <div id="shareCardRender">
        <h2>My Votes Daydreamers Awards</h2>
        <div id="shareCardItems"></div>
        <p style="margin-top: 25px; font-size: 11px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase;">Join the vote!</p>
    </div>

    <div class="admin-btn" onclick="pedirPasswordAdmin('menu')" title="Administrar Nominados">
        <i class="fas fa-cog"></i>
    </div>

    <div class="custom-modal-overlay" id="modalOverlay">
        <div class="custom-modal" id="modalContenido">
        </div>
    </div>

    <script>
        // API Key de ImgBB proporcionada
        const IMGBB_API_KEY = "f5567fb36a6232aae841ea9aac0ee139";

        // ==========================================
        // DICCIONARIO DE IDIOMAS Y THEME
        // ==========================================
        const i18n = {
            en: {
                return: '<i class="fas fa-arrow-left"></i> Return',
                subtitle: 'Support your favorite creators, communities, and moments. Votes decide the season winners.',
                opening_notice: 'Voting opens on September 15th!',
                calculating: 'Calculating...',
                search_placeholder: 'Search nominee by name...',
                all_categories: 'All Categories',
                no_nominees: 'There are no nominees registered yet. Admins can add them.',
                voting_closed_thanks: 'Thanks for participating! Voting has closed. The winners will be announced soon.',
                voted_in: 'You have voted in',
                out_of: 'out of',
                categories: 'categories',
                generate_card: 'Generate My Voting Card',
                closed: 'VOTING CLOSED',
                opens_in: 'Opens in:',
                closes_in: 'Closes in:',
                vote_btn: 'Vote',
                your_vote: '⭐ Your vote',
                votes_word: 'Votes',
                loading_nominees: 'Loading nominees...'
            },
            es: {
                return: '<i class="fas fa-arrow-left"></i> Volver',
                subtitle: 'Apoya a tus creadores, comunidades y momentos favoritos. Los votos deciden a los ganadores.',
                opening_notice: '¡Las votaciones se abren el 15 de septiembre!',
                calculating: 'Calculando...',
                search_placeholder: 'Buscar nominado por nombre...',
                all_categories: 'Todas las Categorías',
                no_nominees: 'Aún no hay nominados registrados. Los administradores pueden añadirlos.',
                voting_closed_thanks: '¡Gracias por participar! Las votaciones han cerrado. Los ganadores serán anunciados pronto.',
                voted_in: 'Has votado en',
                out_of: 'de',
                categories: 'categorías',
                generate_card: 'Generar Mi Tarjeta',
                closed: 'VOTACIONES CERRADAS',
                opens_in: 'Abre en:',
                closes_in: 'Cierra en:',
                vote_btn: 'Votar',
                your_vote: '⭐ Tu voto',
                votes_word: 'Votos',
                loading_nominees: 'Cargando nominados...'
            }
        };

        let currentLang = 'en';
        let currentTheme = 'light';

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            const icon = currentTheme === 'dark' ? 'fa-sun' : 'fa-moon';
            document.getElementById('themeToggle').innerHTML = `<i class="fas ${icon}"></i>`;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'es' : 'en';
            document.getElementById('langToggle').innerText = currentLang === 'en' ? 'ES' : 'EN';
            actualizarTextosUI();
            renderizarVotaciones(); // Re-renderizar para actualizar textos de botones/resultados
            actualizarFiltros();
        }

        function actualizarTextosUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.innerHTML = i18n[currentLang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[currentLang][key]) {
                    el.setAttribute('placeholder', i18n[currentLang][key]);
                }
            });
            actualizarTextoProgreso();
        }

        // Variables Globales
        let esAdmin = false;
        let nominadosData = [];
        let configGlobal = { votacionesCerradas: false };
        let totalCategoriasGlobal = 0;
        let categoriasVotadasGlobal = 0;
        
        // FECHAS DE APERTURA Y CIERRE
        const fechaAperturaFija = new Date("2026-09-15T00:00:00").getTime();
        const fechaCierre = new Date("2026-10-01T00:00:00").getTime();
        let votacionesAbiertasPorFecha = false;

        const modalOverlay = document.getElementById('modalOverlay');
        const modalContenido = document.getElementById('modalContenido');
        const categoriesContainer = document.getElementById('categoriesContainer');

        function abrirModalHTML(htmlContent) {
            modalContenido.innerHTML = htmlContent;
            modalOverlay.style.display = 'flex';
        }
        function cerrarModal() { modalOverlay.style.display = 'none'; }
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) cerrarModal(); });

        // ==========================================
        // INICIO Y CONFIGURACIÓN FIREBASE
        // ==========================================
        function initAwardsLogic() {
            actualizarTextosUI();
            const { db, appId, collection, doc, onSnapshot } = window.fb;
            
            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'awards_settings', 'config');
            onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists()) {
                    configGlobal = docSnap.data();
                }
                iniciarCuentaRegresiva();
                renderizarVotaciones();
            });

            const nomineesRef = collection(db, 'artifacts', appId, 'public', 'data', 'awards_nominees');
            onSnapshot(nomineesRef, (snapshot) => {
                nominadosData = [];
                snapshot.forEach(doc => {
                    nominadosData.push({ id: doc.id, ...doc.data() });
                });
                actualizarFiltros();
                renderizarVotaciones();
            });
        }

        // ==========================================
        // CUENTA REGRESIVA Y CONTROL DE FECHAS
        // ==========================================
        function iniciarCuentaRegresiva() {
            const timerElement = document.getElementById('countdown');
            const noticeElement = document.getElementById('openingNotice');

            const intervalo = setInterval(() => {
                if(configGlobal.votacionesCerradas) {
                    timerElement.innerHTML = `<i class="fas fa-lock"></i> ${i18n[currentLang].closed}`;
                    noticeElement.style.display = 'none';
                    clearInterval(intervalo);
                    return;
                }
                
                const now = new Date().getTime();
                let anteriorEstado = votacionesAbiertasPorFecha;

                if (now < fechaAperturaFija) {
                    votacionesAbiertasPorFecha = false;
                    noticeElement.style.display = 'block';
                    const distance = fechaAperturaFija - now;
                    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    timerElement.innerHTML = `<i class="fas fa-clock"></i> ${i18n[currentLang].opens_in} ${d}d ${h}h ${m}m`;
                } else if (now < fechaCierre) {
                    votacionesAbiertasPorFecha = true;
                    noticeElement.style.display = 'none';
                    const distance = fechaCierre - now;
                    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    timerElement.innerHTML = `<i class="fas fa-clock"></i> ${i18n[currentLang].closes_in} ${d}d ${h}h ${m}m`;
                } else {
                    votacionesAbiertasPorFecha = false;
                    timerElement.innerHTML = `<i class="fas fa-lock"></i> ${i18n[currentLang].closed}`;
                    noticeElement.style.display = 'none';
                    clearInterval(intervalo);
                    if(!configGlobal.votacionesCerradas) {
                        configGlobal.votacionesCerradas = true;
                        renderizarVotaciones();
                    }
                }

                if (anteriorEstado !== votacionesAbiertasPorFecha) {
                    renderizarVotaciones();
                }
            }, 1000);
        }

        // ==========================================
        // FILTROS Y BÚSQUEDA DINÁMICA
        // ==========================================
        function actualizarFiltros() {
            const select = document.getElementById('categoryFilter');
            const categoriasUnicas = [...new Set(nominadosData.map(n => n.categoria.toUpperCase()))];
            select.innerHTML = `<option value="ALL">${i18n[currentLang].all_categories}</option>`;
            categoriasUnicas.forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        window.aplicarFiltros = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedCat = document.getElementById('categoryFilter').value;
            
            const secciones = document.querySelectorAll('.category-section');
            secciones.forEach(sec => {
                const catTitle = sec.getAttribute('data-categoria');
                const cards = sec.querySelectorAll('.nominee-card');
                let cardsVisibles = 0;

                cards.forEach(card => {
                    const name = card.getAttribute('data-name').toLowerCase();
                    const coincideNombre = name.includes(searchTerm);
                    const coincideCat = (selectedCat === 'ALL' || selectedCat === catTitle);

                    if (coincideNombre && coincideCat) {
                        card.style.display = 'flex';
                        cardsVisibles++;
                    } else {
                        card.style.display = 'none';
                    }
                });
                sec.style.display = (cardsVisibles > 0) ? 'block' : 'none';
            });
        }

        function actualizarTextoProgreso() {
            document.getElementById('progressText').innerText = `${i18n[currentLang].voted_in} ${categoriasVotadasGlobal} ${i18n[currentLang].out_of} ${totalCategoriasGlobal} ${i18n[currentLang].categories}`;
        }

        // ==========================================
        // RENDERIZAR CATEGORÍAS Y NOMINADOS
        // ==========================================
        function renderizarVotaciones() {
            if (nominadosData.length === 0) {
                categoriesContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-family: var(--font-classic); font-size: 18px;">${i18n[currentLang].no_nominees}</p>`;
                return;
            }

            const categoriasObj = {};
            nominadosData.forEach(nom => {
                const cat = nom.categoria.toUpperCase();
                if (!categoriasObj[cat]) categoriasObj[cat] = [];
                categoriasObj[cat].push(nom);
            });

            totalCategoriasGlobal = Object.keys(categoriasObj).length;
            categoriasVotadasGlobal = 0;
            categoriesContainer.innerHTML = ''; 

            if(configGlobal.votacionesCerradas) {
                categoriesContainer.innerHTML = `<div style="text-align:center; background:var(--card-bg); color:var(--gold); padding:20px; border-radius:var(--radius-classic); font-weight:600; margin-bottom:20px; border: 1px solid var(--border-color); font-family:var(--font-classic); font-size: 18px;">${i18n[currentLang].voting_closed_thanks}</div>`;
            }

            const isLocked = !votacionesAbiertasPorFecha && !configGlobal.votacionesCerradas;

            for (const [categoria, nominados] of Object.entries(categoriasObj)) {
                nominados.sort((a, b) => (b.votos || 0) - (a.votos || 0));

                const claveLocal = `voto_awards_${categoria}`;
                let votoGuardadoId = localStorage.getItem(claveLocal);
                
                if (window.currentUserUid && localStorage.getItem(`${claveLocal}_uid`) !== window.currentUserUid) {
                    // Prevención cuenta anonima
                }
                
                const categoriaYaVotada = votoGuardadoId !== null;
                if(categoriaYaVotada) categoriasVotadasGlobal++;

                const totalVotosCat = nominados.reduce((sum, n) => sum + (n.votos || 0), 0);

                let htmlTarjetas = '';
                nominados.forEach(nom => {
                    const esMiVoto = votoGuardadoId === nom.id;
                    const porcentaje = totalVotosCat > 0 ? ((nom.votos / totalVotosCat) * 100).toFixed(1) : 0;
                    
                    const editBtnHtml = esAdmin ? `<button class="btn-edit-nominee" onclick="editarNominado('${nom.id}')" title="Editar Nominado"><i class="fas fa-pen"></i></button>` : '';
                    const seguidoresHtml = nom.seguidores ? `<p class="nominee-followers">${nom.seguidores}</p>` : '';
                    const enlaceHtml = nom.enlace ? `<a href="${nom.enlace}" target="_blank" class="nominee-link">Ver Más <i class="fas fa-angle-right"></i></a>` : '';

                    let accionHtml = '';
                    
                    if (configGlobal.votacionesCerradas || categoriaYaVotada) {
                        accionHtml = `
                            <div class="result-bar-container">
                                <div class="result-text"><span>${esMiVoto ? i18n[currentLang].your_vote : i18n[currentLang].votes_word}</span> <span>${porcentaje}%</span></div>
                                <div class="result-bar-bg"><div class="result-bar-fill" style="width: ${porcentaje}%;"></div></div>
                                <div class="nominee-votes" style="margin-top:5px; justify-content: flex-end;">${nom.votos || 0} ${i18n[currentLang].votes_word}</div>
                            </div>
                        `;
                    } else {
                        const disabledAttr = isLocked ? 'disabled title="Votaciones aún no abiertas"' : '';
                        accionHtml = `
                            <p class="nominee-votes">${nom.votos || 0} ${i18n[currentLang].votes_word}</p>
                            <button class="btn-vote" ${disabledAttr} onclick="confirmarVotoModal('${nom.id}', '${categoria}', '${nom.nombre.replace(/'/g, "\\'")}')">${i18n[currentLang].vote_btn}</button>
                        `;
                    }

                    const placeholder = `https://placehold.co/400x300/EAEAEA/C5A059?text=${nom.nombre.substring(0,2)}`;

                    htmlTarjetas += `
                        <div class="nominee-card" data-name="${nom.nombre}">
                            ${editBtnHtml}
                            <div class="nominee-img-wrapper">
                                <img src="${nom.imagenUrl}" alt="${nom.nombre}" class="nominee-img" loading="lazy" onerror="this.src='${placeholder}'">
                            </div>
                            <div class="nominee-info">
                                <div class="nominee-header">
                                    <h3 class="nominee-name">${nom.nombre}</h3>
                                    ${seguidoresHtml}
                                    ${enlaceHtml}
                                </div>
                                <div>
                                    ${accionHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });

                const seccionCat = document.createElement('div');
                seccionCat.className = 'category-section';
                seccionCat.setAttribute('data-categoria', categoria);
                seccionCat.innerHTML = `
                    <h2 class="category-title">${categoria}</h2>
                    <div class="nominees-grid">
                        ${htmlTarjetas}
                    </div>
                `;
                categoriesContainer.appendChild(seccionCat);
            }

            actualizarTextoProgreso();
            const progreso = totalCategoriasGlobal > 0 ? (categoriasVotadasGlobal / totalCategoriasGlobal) * 100 : 0;
            document.getElementById('progressFill').style.width = `${progreso}%`;

            if(categoriasVotadasGlobal > 0) {
                document.getElementById('btnGenerarShare').style.display = 'block';
            }

            aplicarFiltros(); 
        }

        // ==========================================
        // SISTEMA DE VOTACIÓN (CON CONFIRMACIÓN)
        // ==========================================
        window.confirmarVotoModal = function(nomineeId, categoria, nomineeNombre) {
            if (configGlobal.votacionesCerradas || !votacionesAbiertasPorFecha) { return; }

            const btnConfirm = currentLang === 'en' ? 'Confirm Vote' : 'Confirmar Voto';
            const btnCancel = currentLang === 'en' ? 'Cancel' : 'Cancelar';
            const commentPlaceholder = currentLang === 'en' ? 'Optional supportive message...' : 'Mensaje de apoyo opcional...';

            abrirModalHTML(`
                <h3 class="modal-title">${btnConfirm}</h3>
                <p style="text-align:center; font-size:15px; margin-bottom:20px; font-family: var(--font-classic);">
                    ${currentLang === 'en' ? 'You are about to vote for' : 'Estás a punto de votar por'} <strong style="color:var(--gold);">${nomineeNombre}</strong> 
                    ${currentLang === 'en' ? 'in' : 'en'} <strong>${categoria}</strong>.
                </p>
                <div class="form-group">
                    <textarea id="comentarioVoto" placeholder="${commentPlaceholder}"></textarea>
                </div>
                <button class="btn-modal" onclick="ejecutarVoto('${nomineeId}', '${categoria}')">${btnConfirm}</button>
                <button class="btn-modal cancel" onclick="cerrarModal()">${btnCancel}</button>
            `);
        }

        window.ejecutarVoto = function(nomineeId, categoria) {
            const comentario = document.getElementById('comentarioVoto').value.trim();
            const { db, appId, doc, updateDoc, increment, arrayUnion } = window.fb;
            const nomRef = doc(db, 'artifacts', appId, 'public', 'data', 'awards_nominees', nomineeId);

            let dataActualizar = { votos: increment(1) };
            if (comentario !== "") {
                dataActualizar.comentarios = arrayUnion(comentario);
            }

            updateDoc(nomRef, dataActualizar).then(() => {
                localStorage.setItem(`voto_awards_${categoria}`, nomineeId);
                if (window.currentUserUid) {
                    localStorage.setItem(`voto_awards_${categoria}_uid`, window.currentUserUid);
                }
                
                const titleSuccess = currentLang === 'en' ? 'Vote Registered!' : '¡Voto Registrado!';
                const msgSuccess = currentLang === 'en' ? 'Your vote has been successfully counted.' : 'Tu voto se ha contabilizado con éxito.';
                
                abrirModalHTML(`
                    <h3 class="modal-title" style="color: var(--gold); border-bottom: none;"><i class="fas fa-check-circle"></i></h3>
                    <h4 style="text-align:center; font-family: var(--font-classic); font-size: 20px; margin-bottom: 10px;">${titleSuccess}</h4>
                    <p style="text-align:center; color: var(--text-muted); font-size: 14px;">${msgSuccess}</p>
                    <button class="btn-modal" style="margin-top:25px;" onclick="cerrarModal()">${currentLang === 'en' ? 'Continue' : 'Continuar'}</button>
                `);
            }).catch(err => {
                console.error("Error al votar: ", err);
                alert("Hubo un error registrando tu voto.");
            });
        }

        // ==========================================
        // GENERAR TARJETA DE VOTANTE (SHARE CARD + CUSTOM ANIMATION)
        // ==========================================
        window.generarShareCard = function() {
            const containerItems = document.getElementById('shareCardItems');
            containerItems.innerHTML = '';
            
            let votosRealizados = 0;
            nominadosData.forEach(nom => {
                const categoria = nom.categoria.toUpperCase();
                if(localStorage.getItem(`voto_awards_${categoria}`) === nom.id) {
                    votosRealizados++;
                    containerItems.innerHTML += `
                        <div class="share-item">
                            <span>${categoria}</span>
                            <strong>${nom.nombre}</strong>
                        </div>
                    `;
                }
            });

            if(votosRealizados === 0) {
                alert(currentLang === 'en' ? "You haven't voted for any nominee yet." : "No has votado por ningún nominado aún.");
                return;
            }

            const elementoCanvas = document.getElementById('shareCardRender');
            elementoCanvas.style.left = "0";
            elementoCanvas.style.zIndex = "-1";

            abrirModalHTML(`
                <div class="loader-wrapper">
                    <span class="loader-letter">G</span>
                    <span class="loader-letter">e</span>
                    <span class="loader-letter">n</span>
                    <span class="loader-letter">e</span>
                    <span class="loader-letter">r</span>
                    <span class="loader-letter">a</span>
                    <span class="loader-letter">t</span>
                    <span class="loader-letter">i</span>
                    <span class="loader-letter">n</span>
                    <span class="loader-letter">g</span>
                    <div class="loader"></div>
                </div>
            `);

            setTimeout(() => {
                const isDark = currentTheme === 'dark';
                const bgCanvas = isDark ? '#1A1A1A' : '#FFFFFF';
                
                html2canvas(elementoCanvas, { backgroundColor: bgCanvas }).then(canvas => {
                    elementoCanvas.style.left = "-9999px"; 
                    const imgData = canvas.toDataURL('image/png');
                    
                    const titleCard = currentLang === 'en' ? 'Your Voter Card' : 'Tu Tarjeta de Votante';
                    const btnDown = currentLang === 'en' ? 'Download Image' : 'Descargar Imagen';
                    const btnClose = currentLang === 'en' ? 'Close' : 'Cerrar';

                    abrirModalHTML(`
                        <h3 class="modal-title">${titleCard}</h3>
                        <div style="text-align:center; margin-bottom:20px; border: 1px solid var(--border-color); padding: 5px; background: var(--light-bg);">
                            <img src="${imgData}" style="width:100%; max-width:380px; display:block; margin: 0 auto;">
                        </div>
                        <a href="${imgData}" download="My_Daydreamers_Votes.png" class="btn-modal" style="display:block; text-align:center; text-decoration:none;">
                            ${btnDown}
                        </a>
                        <button class="btn-modal cancel" onclick="cerrarModal()">${btnClose}</button>
                    `);
                });
            }, 2500); 
        }

        // ==========================================
        // PANEL DE ADMINISTRADOR & EXPORTACIÓN CSV
        // ==========================================
        window.pedirPasswordAdmin = function(accion = 'menu', nomineeId = null) {
            if (esAdmin) {
                if (accion === 'editar') mostrarFormularioEditar(nomineeId);
                else mostrarFormularioAdmin();
                return;
            }

            abrirModalHTML(`
                <h3 class="modal-title">Admin Access</h3>
                <div class="form-group">
                    <input type="password" id="adminPassAwards" placeholder="Password..." onkeypress="if(event.key === 'Enter') verificarAdminAwards('${accion}', '${nomineeId || ''}')">
                </div>
                <button class="btn-modal" onclick="verificarAdminAwards('${accion}', '${nomineeId || ''}')">Enter</button>
                <button class="btn-modal cancel" onclick="cerrarModal()">Cancel</button>
            `);
        }

        window.verificarAdminAwards = function(accion = 'menu', nomineeId = null) {
            if (document.getElementById('adminPassAwards').value === 'admin540') {
                esAdmin = true;
                renderizarVotaciones();
                if (accion === 'editar' && nomineeId) mostrarFormularioEditar(nomineeId);
                else mostrarFormularioAdmin();
            } else {
                abrirModalHTML(`<h3 class="modal-title" style="color:#d9534f;">Incorrect</h3><button class="btn-modal" onclick="cerrarModal()">Close</button>`);
            }
        }

        function mostrarFormularioAdmin() {
            const btnEstadoVotaciones = configGlobal.votacionesCerradas 
                ? `<button class="btn-modal" style="background:#2b3e50; border-color: #2b3e50;" onclick="toggleEstadoVotaciones(false)">Reabrir Votaciones</button>`
                : `<button class="btn-modal danger" onclick="toggleEstadoVotaciones(true)">Cerrar Forzoso (Fin)</button>`;

            abrirModalHTML(`
                <h3 class="modal-title">Panel de Administración</h3>
                
                <div style="display:flex; flex-direction:column; gap:10px; margin-bottom: 25px;">
                    <button class="btn-modal cancel" style="margin-top:0;" onclick="exportarResultadosCSV()">Exportar CSV</button>
                    ${btnEstadoVotaciones}
                </div>

                <hr style="border:0; border-top:1px solid var(--border-color); margin-bottom:20px;">
                <h4 style="color:var(--text-main); margin-bottom:15px; text-align: center; font-family: var(--font-classic);">Añadir Nuevo Nominado</h4>

                <div class="form-group"><input type="text" id="addNomNombre" placeholder="Nombre (Ej: Adele Global)"></div>
                <div class="form-group"><input type="text" id="addNomCategoria" placeholder="Categoría (Ej: Mejor Comunidad)"></div>
                <div class="form-group"><input type="text" id="addNomSeguidores" placeholder="Subtítulo/Seguidores (Ej: 10.5K)"></div>
                <div class="form-group"><input type="url" id="addNomEnlace" placeholder="Enlace a Página/Perfil (Opcional)"></div>
                <div class="form-group"><label>Fotografía (ImgBB)</label><input type="file" id="addNomFile" accept="image/*"></div>
                
                <div id="uploadLoader" class="admin-spinner"><i class="fas fa-spinner fa-spin"></i> Procesando imagen...</div>
                
                <button class="btn-modal" id="btnGuardarNom" onclick="guardarNominado()">Publicar Nominado</button>
                <button class="btn-modal cancel" onclick="cerrarModal()">Cerrar Panel</button>
            `);
        }

        window.toggleEstadoVotaciones = async function(cerrar) {
            const { db, appId, doc, setDoc } = window.fb;
            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'awards_settings', 'config');
            await setDoc(configRef, { votacionesCerradas: cerrar }, { merge: true });
            alert(cerrar ? "Votaciones cerradas manualmente." : "Votaciones reabiertas.");
            mostrarFormularioAdmin();
        }

        window.exportarResultadosCSV = function() {
            let csvContent = "ID,Nombre,Categoria,Votos,Seguidores,Enlace\n";
            let dataExportar = [...nominadosData].sort((a, b) => {
                if(a.categoria === b.categoria) return (b.votos || 0) - (a.votos || 0);
                return a.categoria.localeCompare(b.categoria);
            });

            dataExportar.forEach(n => {
                const name = (n.nombre || "").replace(/"/g, '""');
                const cat = (n.categoria || "").replace(/"/g, '""');
                csvContent += `${n.id},"${name}","${cat}",${n.votos || 0},"${n.seguidores || ''}","${n.enlace || ''}"\n`;
            });

            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: "text/csv;charset=utf-8;" }); 
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            const fechaTxt = new Date().toISOString().split('T')[0];
            link.setAttribute("download", `resultados_votaciones_${fechaTxt}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.guardarNominado = async function() {
            const nombre = document.getElementById('addNomNombre').value.trim();
            const categoria = document.getElementById('addNomCategoria').value.trim();
            const fileInput = document.getElementById('addNomFile');
            const loader = document.getElementById('uploadLoader');
            const btnGuardar = document.getElementById('btnGuardarNom');

            if (!nombre || !categoria || fileInput.files.length === 0) {
                alert("Completa nombre, categoría e imagen."); return;
            }

            btnGuardar.disabled = true; loader.style.display = 'block';

            try {
                const formData = new FormData(); formData.append('image', fileInput.files[0]);
                const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const imgbbData = await imgbbResponse.json();
                
                if (!imgbbData.success) throw new Error("Error ImgBB");
                
                const { db, appId, collection, addDoc } = window.fb;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'awards_nominees'), {
                    nombre: nombre, categoria: categoria,
                    seguidores: document.getElementById('addNomSeguidores').value.trim(),
                    enlace: document.getElementById('addNomEnlace').value.trim(),
                    imagenUrl: imgbbData.data.url, votos: 0, fechaRegistro: new Date().toISOString()
                });

                abrirModalHTML(`<h3 class="modal-title" style="color:var(--gold);">Nominado Añadido</h3><button class="btn-modal" onclick="mostrarFormularioAdmin()">Añadir Otro</button>`);
            } catch (error) {
                console.error(error); alert("Error en el proceso.");
                btnGuardar.disabled = false; loader.style.display = 'none';
            }
        }

        // ==========================================
        // EDITAR NOMINADO
        // ==========================================
        window.editarNominado = function(nomineeId) {
            if (!esAdmin) pedirPasswordAdmin('editar', nomineeId);
            else mostrarFormularioEditar(nomineeId);
        }

        function mostrarFormularioEditar(nomineeId) {
            const nom = nominadosData.find(n => n.id === nomineeId);
            if (!nom) return;
            abrirModalHTML(`
                <h3 class="modal-title">Editar Nominado</h3>
                <div class="form-group"><label>Nombre</label><input type="text" id="editNomNombre" value="${nom.nombre || ''}"></div>
                <div class="form-group"><label>Categoría</label><input type="text" id="editNomCategoria" value="${nom.categoria || ''}"></div>
                <div class="form-group"><label>Subtítulo/Seguidores</label><input type="text" id="editNomSeguidores" value="${nom.seguidores || ''}"></div>
                <div class="form-group"><label>Enlace</label><input type="url" id="editNomEnlace" value="${nom.enlace || ''}"></div>
                <div class="form-group"><label>Nueva Fotografía (Opcional)</label><input type="file" id="editNomFile" accept="image/*"></div>
                <div id="uploadLoader" class="admin-spinner"><i class="fas fa-spinner fa-spin"></i> Actualizando...</div>
                <button class="btn-modal" id="btnActualizarNom" onclick="actualizarNominado('${nom.id}', '${nom.imagenUrl}')">Guardar Cambios</button>
                <button class="btn-modal cancel" onclick="cerrarModal()">Cancelar</button>
            `);
        }

        window.actualizarNominado = async function(nomineeId, imagenUrlActual) {
            const btnGuardar = document.getElementById('btnActualizarNom');
            const loader = document.getElementById('uploadLoader');
            const fileInput = document.getElementById('editNomFile');

            btnGuardar.disabled = true; loader.style.display = 'block';
            let imageUrl = imagenUrlActual;

            try {
                if (fileInput.files.length > 0) {
                    const formData = new FormData(); formData.append('image', fileInput.files[0]);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) imageUrl = data.data.url;
                }

                const { db, appId, doc, updateDoc } = window.fb;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'awards_nominees', nomineeId), {
                    nombre: document.getElementById('editNomNombre').value.trim(),
                    categoria: document.getElementById('editNomCategoria').value.trim(),
                    seguidores: document.getElementById('editNomSeguidores').value.trim(),
                    enlace: document.getElementById('editNomEnlace').value.trim(),
                    imagenUrl: imageUrl
                });
                cerrarModal();
            } catch (error) {
                console.error(error); alert("Error al actualizar.");
                btnGuardar.disabled = false; loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
